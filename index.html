<style>
/* Layout: barra superior fija con pestañas por rol; contenido en una columna (celular) que se abre a grilla en computador */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#E4E9EE; --ink:#17202A; --muted:#58646F; --line:#D2D9E0;
  --accent:#1C5DA8; --accent-ink:#FFFFFF; --accent-soft:#DCE8F6;
  --run:#C4610A; --run-soft:#FBE9D8; --ok:#1F7A49; --ok-soft:#DDF1E5; --warn:#9A6408; --warn-soft:#F8EDD3; --bad:#B3362E; --bad-soft:#F7DEDB;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,32,44,.06),0 2px 8px rgba(20,32,44,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161C; --surface:#19212A; --surface2:#222C37; --ink:#E5EAF0; --muted:#97A3AF; --line:#2E3946;
  --accent:#62A0EA; --accent-ink:#0D1620; --accent-soft:#1D3048;
  --run:#F0953A; --run-soft:#3A2817; --ok:#55BE82; --ok-soft:#173326; --warn:#E3B04F; --warn-soft:#352B14; --bad:#EE6E64; --bad-soft:#3A1E1C;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19212A; --surface2:#222C37; --ink:#E5EAF0; --muted:#97A3AF; --line:#2E3946;
  --accent:#62A0EA; --accent-ink:#0D1620; --accent-soft:#1D3048;
  --run:#F0953A; --run-soft:#3A2817; --ok:#55BE82; --ok-soft:#173326; --warn:#E3B04F; --warn-soft:#352B14; --bad:#EE6E64; --bad-soft:#3A1E1C;
  --shadow:none; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.who .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.tab[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.demo{background:var(--warn-soft);color:var(--warn);font-size:.85rem}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:8px}
.demo select{width:auto;min-height:0;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}

main.wrap{padding-block:18px 64px;display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0;display:grid;gap:12px;align-content:start}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.1}
.sep{border:0;border-top:1px solid var(--line);margin:0}

/* placa OT */
.ot{display:inline-flex;align-items:center;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:.9rem;padding:2px 8px;border:1.5px solid currentColor;border-radius:4px;color:var(--accent);white-space:nowrap}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;min-height:40px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.run{background:var(--run);border-color:var(--run);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.xl{min-height:56px;font-size:1.05rem;padding-inline:18px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tile{display:grid;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;min-height:64px}
.tile:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}

/* chips de estado */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.run{background:var(--run-soft);color:var(--run)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.est{background:transparent;border:1px dashed currentColor;color:var(--warn)}

/* tarea en curso */
.live{border-color:var(--run);background:linear-gradient(0deg,var(--run-soft),var(--run-soft)),var(--surface)}
.timer{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:1;color:var(--run);letter-spacing:.02em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--run);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* listas */
.list{display:grid}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item .t{font-weight:600;min-width:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface2)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}

/* barras */
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.bar>i.over{background:var(--bad)} .bar>i.warn{background:var(--warn)}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.stack{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--surface2)}
.stack>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.92rem}
.kv .v{text-align:right;font-weight:600}
.kv .tot{border-top:1px solid var(--line);padding-top:6px}

/* formularios */
form{display:grid;gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f>span{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:44px}
textarea{min-height:70px;resize:vertical}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.check input{width:20px;height:20px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:9px 10px;font-weight:600;cursor:pointer;color:var(--muted);min-width:max-content}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* hoja modal */
.ov{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(640px,100%);max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.alert{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.login{max-width:380px;margin:8vh auto;display:grid;gap:16px}
.pill-n{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
details>summary{cursor:pointer;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}
details[open]>summary::before{content:"▾ "}
.hide-sm{} @media (max-width:560px){.hide-sm{display:none}}
</style>

   de ejemplo guardados solo en este navegador.

const CONFIG = {

  SUPABASE_ANON_KEY: 'sb_publishable_U4TxDp33bdkDt15d5VGGMQ_dUm5l2QL',

  EMPRESA: 'IMT Ingeniería'

<script>
'use strict';
/* ---------------------------------------------------------------- utilidades */
const TZ = 'America/Santiago';
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => new Date(d).toLocaleDateString('sv-SE', {timeZone: TZ});
const hoy = () => ymd(Date.now());
const hhmm = d => d ? new Date(d).toLocaleTimeString('es-CL', {timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false}) : '—';
const clp = n => (n < 0 ? '−$' : '$') + Math.round(Math.abs(n || 0)).toLocaleString('es-CL');
const num = (n, d = 1) => (+n || 0).toLocaleString('es-CL', {maximumFractionDigits: d});
const hrs = n => num(n, 1) + ' h';
const pct = n => num(n, 0) + '%';
const r2 = n => Math.round(n * 100) / 100;
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const addDays = (f, n) => { const [y, m, d] = f.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n, 12)).toISOString().slice(0, 10); };
const dow = f => { const [y, m, d] = f.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)).getUTCDay(); };
const fechaTxt = f => { if (!f) return '—'; const [y, m, d] = f.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString('es-CL', {weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'}); };
function tsAt(f, hm) { // fecha + "HH:MM" en hora de Santiago -> ISO
  const g = new Date(`${f}T${hm}:00Z`);
  const loc = new Date(g.toLocaleString('sv-SE', {timeZone: TZ}).replace(' ', 'T') + 'Z');
  return new Date(g.getTime() - (loc - g)).toISOString();
}
const elapsedH = (a, b) => (new Date(b || Date.now()) - new Date(a)) / 3.6e6;
const durTxt = h => { const m = Math.max(0, Math.floor(h * 60)); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };
const byId = (arr, id) => arr.find(x => x.id === id);
const TIPOS_HH = {directa: 'Directa', retrabajo: 'Retrabajo', indirecta: 'Indirecta', improductiva: 'Improductiva'};
const TIPOS_SERV = {pintura: 'Pintura', tratamiento_termico: 'Tratamiento térmico', ensayo: 'Ensayo / END', transporte: 'Transporte', otro: 'Otro'};
const ESTADOS_OT = {cotizada: 'Cotizada', en_proceso: 'En proceso', terminada: 'Terminada', entregada: 'Entregada'};
const ROLES = {operario: 'Operario', bodega: 'Bodega', jefe: 'Jefe de taller', admin: 'Administrador'};
const MOTIVOS = {
  indirecta: ['Aseo y orden', 'Traslado de material', 'Mantención de equipos', 'Capacitación', 'Charla de seguridad', 'Otra indirecta'],
  improductiva: ['Espera de material', 'Espera de instrucciones o planos', 'Máquina detenida', 'Espera de puente grúa', 'Corte de energía', 'Otra espera']
};
const COL = {directa: 'var(--accent)', retrabajo: 'var(--bad)', indirecta: 'var(--muted)', improductiva: 'var(--warn)'};

/* ---------------------------------------------------------------- estado */
const S = {
  me: null, tab: null, demoAs: null,
  d: {config: [], tarifas: [], perfiles: [], operaciones: [], maquinas: [], procesos: [], materiales: [], dias_especiales: [],
      ots: [], ot_ppto: [], hh: [], asistencia: [], consumos: [], servicios: [], stock_ingresos: []},
  ui: {valFecha: null, otFiltro: 'activas', bodTab: 'consumo', repDesde: null, repHasta: null, ajTab: 'trabajadores'}
};
const cfg = k => +(S.d.config.find(c => c.clave === k)?.valor ?? ({gg_pct: 18, jornada_horas: 8, colacion_min: 60})[k]);
const role = () => S.me?.rol;
const isAdmin = () => role() === 'admin';
const isJefe = () => role() === 'jefe' || role() === 'admin';
const perfil = id => byId(S.d.perfiles, id);
const otOf = id => byId(S.d.ots, id);
const opOf = id => byId(S.d.operaciones, id);
const closed = r => !!(r.fin || r.manual);

/* ================================================================ BACKEND DEMO
   Replica en el navegador lo que hacen los triggers de schema.sql */
const Demo = (() => {
  const KEY = 'taller-demo-v1';
  let T = null;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(T)); } catch (e) {} };
  const nid = t => (T._seq[t] = (T._seq[t] || 0) + 1);
  const PK = {config: 'clave', ot_ppto: 'ot_id', dias_especiales: 'fecha', hh_costo: 'registro_id'};
  const pk = t => PK[t] || 'id';
  const defaults = {
    hh_registros: () => ({perfil_id: S.me.id, tipo: 'directa', horas: 0, horas_extra: 0, manual: false, extra_manual: false, estado: 'pendiente', creado: new Date().toISOString(), ot_id: null, operacion_id: null, maquina_id: null, inicio: null, fin: null, motivo: null, nota: null, tarifa_id: null, fecha: null}),
    consumos: () => ({origen: 'bodega', estado_costo: 'pendiente', fecha: hoy(), registrado_por: S.me.id, costo_unit: null, material_id: null, descripcion: null, unidad: null, doc_ref: null}),
    servicios: () => ({tipo: 'otro', estado_costo: 'pendiente', fecha: hoy(), registrado_por: S.me.id, costo_unit: null, proceso_id: null, descripcion: null, unidad: null, proveedor: null, doc_ref: null, cantidad: 1}),
    stock_ingresos: () => ({fecha: hoy(), registrado_por: S.me.id, costo_unit: null, doc_ref: null}),
    asistencia: () => ({perfil_id: S.me.id, entrada: null, salida: null}),
    ots: () => ({estado: 'en_proceso', cantidad: 1, terminadas: 0, unidad: 'pza', creada: new Date().toISOString()}),
    materiales: () => ({stock: 0, stock_min: 0, activo: true, costo_estimado: false, unidad: 'un'}),
    perfiles: () => ({rol: 'operario', activo: true}),
    maquinas: () => ({activa: true, estimada: false, costo_hh: 0}),
    operaciones: () => ({activa: true}),
    procesos: () => ({estimada: false, tipo: 'otro'}),
    tarifas: () => ({estimada: false})
  };
  function costFill(r, cat, estField) {
    if (cat) {
      if (r.descripcion == null) r.descripcion = cat.nombre;
      if (r.unidad == null) r.unidad = cat.unidad;
      if (r.costo_unit == null && cat.costo_unit != null) { r.costo_unit = +cat.costo_unit; r.estado_costo = cat[estField] ? 'estimado' : 'real'; }
    }
    if (r.costo_unit == null || r.costo_unit === '') { r.costo_unit = null; r.estado_costo = 'pendiente'; }
    else if (r.estado_costo === 'pendiente') r.estado_costo = 'real';
    r.total = (+r.cantidad || 0) * (+r.costo_unit || 0);
  }
  function before(t, r, old) {
    if (t === 'hh_registros') {
      if (!r.fecha) r.fecha = ymd(r.inicio || Date.now());
      if (r.tarifa_id == null) r.tarifa_id = T.perfiles.find(p => p.id === r.perfil_id)?.tarifa_id ?? null;
      if (r.fin && !r.manual && r.inicio) r.horas = r2(elapsedH(r.inicio, r.fin));
      r.horas = +r.horas || 0; r.horas_extra = +r.horas_extra || 0;
      if (closed(r) && !r.extra_manual && (!old || !old.fin || r.horas !== +old.horas || r.fecha !== old.fecha)) {
        const jor = +(T.config.find(c => c.clave === 'jornada_horas')?.valor ?? 8);
        const prev = sum(T.hh_registros.filter(x => x.perfil_id === r.perfil_id && x.fecha === r.fecha && x.id < r.id && closed(x)), x => x.horas);
        const esp = dow(r.fecha) === 0 || T.dias_especiales.some(d => d.fecha === r.fecha);
        r.horas_extra = esp ? r.horas : Math.max(0, Math.min(r.horas, prev + r.horas - jor));
      }
    }
    if (t === 'consumos') costFill(r, T.materiales.find(m => m.id === r.material_id), 'costo_estimado');
    if (t === 'servicios') { const p = T.procesos.find(x => x.id === r.proceso_id); if (p) r.tipo = p.tipo; costFill(r, p, 'estimada'); }
  }
  function after(t, r, op) {
    if (t === 'hh_registros') {
      if (!closed(r)) return;
      const ta = T.tarifas.find(x => x.id === r.tarifa_id), m = T.maquinas.find(x => x.id === r.maquina_id);

/* ================================================================ BACKEND SUPABASE */
const Cloud = (() => {
  let sb = null;
  const PK = {config: 'clave', ot_ppto: 'ot_id', dias_especiales: 'fecha'};
  const tbl = t => t === 'hh' ? 'v_hh' : t;
  async function all(q) { const out = []; for (let from = 0; ; from += 1000) { const {data, error} = await q().range(from, from + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out; }
  return {
    init() { sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); return sb; },
    get sb() { return sb; },
    async load() {
      const desde = addDays(hoy(), -62);
      const simple = ['config', 'tarifas', 'perfiles', 'operaciones', 'maquinas', 'procesos', 'materiales', 'dias_especiales', 'ots', 'ot_ppto', 'consumos', 'servicios'];
      const res = await Promise.all(simple.map(t => all(() => sb.from(t).select('*').order(PK[t] || 'id'))));
      const out = {}; simple.forEach((t, i) => out[t] = res[i]);
      const activas = out.ots.filter(o => o.estado !== 'entregada').map(o => o.id);
      const [h1, h2, as, si] = await Promise.all([
        all(() => sb.from('v_hh').select('*').gte('fecha', desde).order('id')),
        activas.length ? all(() => sb.from('v_hh').select('*').in('ot_id', activas).lt('fecha', desde).order('id')) : [],
        all(() => sb.from('asistencia').select('*').gte('fecha', desde).order('id')),
        all(() => sb.from('stock_ingresos').select('*').gte('fecha', desde).order('id'))]);
      out.hh = [...h1, ...h2]; out.asistencia = as; out.stock_ingresos = si;
      return out;
    },
    async ins(t, row) { const {data, error} = await sb.from(t).insert(row).select().single(); if (error) throw error; return data; },
    async upd(t, id, patch) { const {data, error} = await sb.from(t).update(patch).eq(PK[t] || 'id', id).select(); if (error) throw error; if (!data?.length) throw new Error('No tienes permiso para modificar este registro'); return data[0]; },
    async upsert(t, row) { const {data, error} = await sb.from(t).upsert(row).select().single(); if (error) throw error; return data; },
    async del(t, id) { const {error} = await sb.from(t).delete().eq(PK[t] || 'id', id); if (error) throw error; },
    async hhQuery({desde, hasta, ot}) { let q = () => { let x = sb.from('v_hh').select('*'); if (desde) x = x.gte('fecha', desde); if (hasta) x = x.lte('fecha', hasta); if (ot) x = x.eq('ot_id', ot); return x.order('id'); }; return all(q); }
  };
})();

/* ================================================================ CÁLCULOS */
function hhDia(pid, f) { return S.d.hh.filter(r => r.perfil_id === pid && r.fecha === f); }
function asisDia(pid, f) { return S.d.asistencia.find(a => a.perfil_id === pid && a.fecha === f); }
function horasAsistidas(a) { if (!a?.entrada) return null; const h = elapsedH(a.entrada, a.salida || Date.now()); return Math.max(0, h - (h > 5 ? cfg('colacion_min') / 60 : 0)); }
function cuadre(pid, f) {
  const rs = hhDia(pid, f), a = asisDia(pid, f);
  const reg = sum(rs.filter(closed), r => r.horas) + sum(rs.filter(r => !closed(r)), r => elapsedH(r.inicio));
  const asi = horasAsistidas(a), abierta = rs.some(r => !closed(r));
  const diff = asi == null ? null : reg - asi;
  let st = 'ok', txt = 'Cuadrado';
  if (!rs.length && !a) { st = 'none'; txt = 'Sin registros'; }
  else if (a == null) { st = 'warn'; txt = 'Sin asistencia'; }
  else if (!a.salida && f !== hoy()) { st = 'warn'; txt = 'Sin hora de salida'; }
  else if (abierta && f !== hoy()) { st = 'bad'; txt = 'Tarea sin cerrar'; }
  else if (f === hoy() && !a.salida) { st = 'run'; txt = 'En jornada'; }
  else if (Math.abs(diff) > 0.25) { st = diff < 0 ? 'bad' : 'warn'; txt = diff < 0 ? `Faltan ${hrs(-diff)}` : `Sobran ${hrs(diff)}`; }
  return {rs, a, reg, asi, diff, st, txt, pend: rs.filter(r => r.estado === 'pendiente').length, extra: sum(rs, r => r.horas_extra)};
}
function costOT(ot) {
  const hh = S.d.hh.filter(r => r.ot_id === ot.id);
  const hc = hh.filter(closed), open = hh.filter(r => !closed(r));
  const cons = S.d.consumos.filter(c => c.ot_id === ot.id), serv = S.d.servicios.filter(s => s.ot_id === ot.id);
  const c = {
    horas: sum(hc, r => r.horas) + sum(open, r => elapsedH(r.inicio)), horasExtra: sum(hc, r => r.horas_extra),
    horasRet: sum(hc.filter(r => r.tipo === 'retrabajo'), r => r.horas), horasPend: sum(hc.filter(r => r.estado === 'pendiente'), r => r.horas),
    mo: sum(hc, r => r.costo_hh), extra: sum(hc, r => r.costo_extra), maq: sum(hc, r => r.costo_maquina),
    ret: sum(hc.filter(r => r.tipo === 'retrabajo'), r => (+r.costo_hh || 0) + (+r.costo_extra || 0)),
    mat: sum(cons, x => x.total), servT: {}, serv: sum(serv, x => x.total),
    pendientes: cons.filter(x => x.estado_costo === 'pendiente').length + serv.filter(x => x.estado_costo === 'pendiente').length + hc.filter(r => r.costo_hh == null && isAdmin()).length,
    est: sum(hc.filter(r => r.costo_estimado), r => (+r.costo_hh || 0) + (+r.costo_extra || 0) + (+r.costo_maquina || 0)) + sum(cons.filter(x => x.estado_costo === 'estimado'), x => x.total) + sum(serv.filter(x => x.estado_costo === 'estimado'), x => x.total),
    abiertas: open.length, hh, cons, servL: serv
  };
  serv.forEach(s => c.servT[s.tipo] = (c.servT[s.tipo] || 0) + (+s.total || 0));
  c.directo = c.mo + c.extra + c.maq + c.mat + c.serv;
  c.gg = c.directo * cfg('gg_pct') / 100; c.total = c.directo + c.gg;
  c.unit = c.total / (+ot.cantidad || 1);
  const p = S.d.ot_ppto.find(x => x.ot_id === ot.id);
  c.p = p; c.pDirecto = p ? +p.ppto_hh + +p.ppto_material + +p.ppto_servicios + +p.ppto_maquina : 0;
  c.pTotal = c.pDirecto * (1 + cfg('gg_pct') / 100);
  c.margen = p?.precio_venta ? +p.precio_venta - c.total : null;
  c.estPct = c.total ? (c.est / c.directo) * 100 : 0;
  c.avancePiezas = (+ot.terminadas || 0) / (+ot.cantidad || 1);
  // proyección: costo actual escalado por avance de piezas, si hay piezas terminadas
  c.proy = c.avancePiezas > 0.05 && c.avancePiezas < 1 ? c.total / c.avancePiezas : null;
  return c;
}

      <span class="chip ${q.st === 'ok' ? 'ok' : q.st}">${q.txt}</span></div>

    ${pid ? `<div class="label">${esc(perfil(pid)?.nombre)} · ${fechaTxt(f)}</div>` : `<label class="f"><span>Trabajador</span><select name="pid2" id="as-p">${S.d.perfiles.filter(p => p.activo).map(p => `<option value="${esc(p.id)}">${esc(p.nombre)}</option>`).join('')}</select></label>`}
    <div class="fgrid"><label class="f"><span>Entrada</span><input type="time" name="ent" id="as-e" value="${a?.entrada ? hhmm(a.entrada) : '08:00'}" required></label>

/* ---------------- OT */
function vOTs() {
  const filt = S.ui.otFiltro;
  const ots = S.d.ots.filter(o => filt === 'todas' || (filt === 'activas' ? ['en_proceso', 'cotizada'].includes(o.estado) : ['terminada', 'entregada'].includes(o.estado)))
    .sort((a, b) => (a.estado === 'en_proceso' ? 0 : 1) - (b.estado === 'en_proceso' ? 0 : 1) || (a.fecha_entrega || '9').localeCompare(b.fecha_entrega || '9'));
  return `<div class="row between"><h1>Órdenes de trabajo</h1><button class="btn pri" data-act="ot-new">+ Nueva OT</button></div>
  <div class="seg" style="max-width:420px">${[['activas', 'Activas'], ['cerradas', 'Terminadas'], ['todas', 'Todas']].map(([k, l]) => `<button data-act="ot-filtro" data-k="${k}" aria-pressed="${filt === k}">${l}</button>`).join('')}</div>
  <div class="grid3">${ots.map(otCard).join('') || '<div class="empty">No hay OT en este filtro.</div>'}</div>`;
}
function otCard(o) {
  const c = costOT(o), ph = +o.ppto_horas || 0, ratio = ph ? c.horas / ph : 0;
  const atras = o.fecha_entrega && o.fecha_entrega < hoy() && ['en_proceso', 'cotizada'].includes(o.estado);
  const ratioC = c.pTotal ? c.total / c.pTotal : 0;
  return `<button class="card tile" data-act="ot-open" data-id="${o.id}" style="gap:10px">
    <div class="row between"><span class="ot">${esc(o.numero)}</span><span class="chip ${o.estado === 'en_proceso' ? 'acc' : o.estado === 'cotizada' ? '' : 'ok'}">${ESTADOS_OT[o.estado]}</span></div>
    <div><strong>${esc(o.descripcion || '')}</strong><div class="small muted">${esc(o.cliente)} · ${num(o.cantidad, 0)} ${esc(o.unidad)}${o.fecha_entrega ? ` · entrega ${fechaTxt(o.fecha_entrega)}` : ''}</div></div>
    <div><div class="row between small"><span>HH ${hrs(c.horas)}${ph ? ` de ${hrs(ph)}` : ''}</span><span class="muted">${ph ? pct(ratio * 100) : ''}</span></div>
      <div class="bar"><i class="${ratio > 1 ? 'over' : ratio > .9 ? 'warn' : ''}" style="width:${Math.min(100, ratio * 100)}%"></i></div></div>
    ${+o.cantidad > 1 ? `<div><div class="row between small"><span>Piezas terminadas ${num(o.terminadas, 0)} de ${num(o.cantidad, 0)}</span><span class="muted">${pct(c.avancePiezas * 100)}</span></div><div class="bar"><i style="width:${Math.min(100, c.avancePiezas * 100)}%;background:var(--ok)"></i></div></div>` : ''}
    ${isAdmin() ? `<div><div class="row between small"><span>Costo ${clp(c.total)}${c.pTotal ? ` de ${clp(c.pTotal)}` : ''}</span><span class="muted">${c.pTotal ? pct(ratioC * 100) : ''}</span></div>
      <div class="bar"><i class="${ratioC > 1 ? 'over' : ratioC > .9 ? 'warn' : ''}" style="width:${Math.min(100, ratioC * 100)}%"></i></div></div>` : ''}
    <div class="row" style="gap:6px">${atras ? '<span class="chip bad">Atrasada</span>' : ''}${c.abiertas ? `<span class="chip run"><span class="dot"></span> ${c.abiertas} trabajando</span>` : ''}
      ${c.horasRet ? `<span class="chip bad">${hrs(c.horasRet)} retrabajo</span>` : ''}
      ${isAdmin() && c.pendientes ? `<span class="chip warn">${c.pendientes} costos sin dato</span>` : ''}
      ${isAdmin() && c.estPct >= 1 ? `<span class="chip est">${pct(c.estPct)} estimado</span>` : ''}
      ${isAdmin() && c.margen != null && o.estado !== 'cotizada' ? `<span class="chip ${c.margen < 0 ? 'bad' : 'ok'}">Margen ${clp(c.margen)}</span>` : ''}</div>
  </button>`;
}
function vOTDetalle() {
  const o = otOf(S.ui.otId); if (!o) { S.tab = 'ots'; return vOTs(); }
  const c = costOT(o), adm = isAdmin();
  const porOp = {}, porPer = {};
  c.hh.forEach(r => { const h = closed(r) ? +r.horas : elapsedH(r.inicio); const k = opOf(r.operacion_id)?.nombre || 'Sin operación'; porOp[k] = (porOp[k] || 0) + h; const n = perfil(r.perfil_id)?.nombre || '—'; porPer[n] = (porPer[n] || 0) + h; });
  const maxOp = Math.max(1, ...Object.values(porOp));
  const p = c.p || {};
  const line = (l, real, pp, est) => `<tr><td>${l}${est ? ' <span class="chip est">estimado</span>' : ''}</td><td class="n">${clp(real)}</td>${c.p ? `<td class="n">${clp(pp)}</td><td class="n" style="color:${real > pp && pp ? 'var(--bad)' : 'inherit'}">${pp ? clp(real - pp) : '—'}</td>` : ''}</tr>`;
  const estHH = c.hh.some(r => r.costo_estimado), estMat = c.cons.some(x => x.estado_costo === 'estimado'), estServ = c.servL.some(x => x.estado_costo === 'estimado');
  return `
  <div class="row"><button class="btn ghost" data-act="tab" data-k="ots">‹ Órdenes de trabajo</button></div>
  <div class="row between"><div><div class="row"><span class="ot" style="font-size:1.1rem">${esc(o.numero)}</span><span class="chip acc">${ESTADOS_OT[o.estado]}</span></div>
     <h1 style="margin-top:6px">${esc(o.descripcion || '')}</h1><div class="muted">${esc(o.cliente)} · ${num(o.cantidad, 0)} ${esc(o.unidad)}${o.fecha_entrega ? ` · entrega ${fechaTxt(o.fecha_entrega)}` : ''}</div></div>
    <div class="row"><button class="btn" data-act="ot-edit" data-id="${o.id}">Editar OT</button>${adm ? `<button class="btn" data-act="ot-csv" data-id="${o.id}">Exportar detalle</button>` : ''}</div></div>
  ${adm ? `<div class="grid2">
    <div class="card"><div class="label">Costo real a la fecha</div><div class="big">${clp(c.total)}</div>
      <div class="small muted">${c.p ? `Presupuesto ${clp(c.pTotal)} · ` : ''}${num(o.cantidad, 0) > 1 ? `${clp(c.unit)} por ${esc(o.unidad)} sobre ${num(o.cantidad, 0)}` : ''}</div>
      ${c.proy ? `<div class="small">Proyección al terminar (según ${pct(c.avancePiezas * 100)} de piezas): <strong>${clp(c.proy)}</strong></div>` : ''}
      <div class="row">${c.margen != null ? `<span class="chip ${c.margen < 0 ? 'bad' : 'ok'}">Margen actual ${clp(c.margen)} (${pct(c.margen / p.precio_venta * 100)})</span>` : ''}
        ${c.estPct >= 1 ? `<span class="chip est">${pct(c.estPct)} del costo es estimado</span>` : ''}${c.pendientes ? `<span class="chip warn">${c.pendientes} ítems sin costo</span>` : ''}
        ${c.horasPend ? `<span class="chip">${hrs(c.horasPend)} sin aprobar</span>` : ''}</div></div>
    <div class="card"><div class="label">Real vs cotizado</div><div class="tbl-wrap"><table><thead><tr><th>Ítem</th><th class="n">Real</th>${c.p ? '<th class="n">Cotizado</th><th class="n">Diferencia</th>' : ''}</tr></thead><tbody>
      ${line('Mano de obra (normal + extra)', c.mo + c.extra, +p.ppto_hh, estHH)}${line('Horas máquina', c.maq, +p.ppto_maquina)}${line('Materiales', c.mat, +p.ppto_material, estMat)}${line('Pintura, TT y servicios', c.serv, +p.ppto_servicios, estServ)}
      ${line(`Gastos generales ${cfg('gg_pct')}%`, c.gg, c.pTotal - c.pDirecto)}
      <tr><td><strong>Total</strong></td><td class="n"><strong>${clp(c.total)}</strong></td>${c.p ? `<td class="n"><strong>${clp(c.pTotal)}</strong></td><td class="n"><strong>${clp(c.total - c.pTotal)}</strong></td>` : ''}</tr>
      </tbody></table></div>
      <div class="small muted">Horas extra: ${hrs(c.horasExtra)} = ${clp(c.extra)}. Retrabajo: ${hrs(c.horasRet)} = ${clp(c.ret)}.${c.p ? '' : ' Sin cotización cargada: edita la OT para ingresarla.'}</div></div></div>` : ''}
  <div class="grid2">
    <div class="card"><div class="row between"><h3>Horas hombre</h3><span class="muted small">${hrs(c.horas)}${+o.ppto_horas ? ` de ${hrs(o.ppto_horas)} cotizadas` : ''}</span></div>
      ${Object.entries(porOp).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div><div class="row between small"><span>${esc(k)}</span><span>${hrs(v)}</span></div><div class="bar"><i style="width:${v / maxOp * 100}%"></i></div></div>`).join('') || '<div class="empty">Sin horas registradas.</div>'}
      <details><summary class="small">Por persona</summary><div class="kv small" style="margin-top:8px">${Object.entries(porPer).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span>${esc(k)}</span><span class="v">${hrs(v)}</span>`).join('')}</div></details></div>
    <div class="card"><div class="row between"><h3>Materiales</h3>${adm ? `<span class="muted small">${clp(c.mat)}</span>` : ''}</div>
      ${c.cons.length ? `<div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="n">Cant.</th>${adm ? '<th class="n">Total</th><th></th>' : ''}</tr></thead><tbody>${c.cons.map(x => `<tr><td style="white-space:normal">${esc(x.descripcion)}${x.origen === 'compra_directa' ? ' <span class="chip">compra directa</span>' : ''}</td><td class="n">${num(x.cantidad, 2)} ${esc(x.unidad || '')}</td>
        ${adm ? `<td class="n">${x.estado_costo === 'pendiente' ? '<span class="chip warn">sin costo</span>' : clp(x.total)}${x.estado_costo === 'estimado' ? ' <span class="chip est">est.</span>' : ''}</td><td><button class="btn ghost" data-act="costo-edit" data-t="consumos" data-id="${x.id}">${x.estado_costo === 'real' ? 'Editar' : 'Completar'}</button></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sin consumos.</div>'}</div>
    <div class="card"><div class="row between"><h3>Pintura, tratamiento térmico y servicios</h3>${adm ? `<span class="muted small">${clp(c.serv)}</span>` : ''}</div>
      ${c.servL.length ? `<div class="tbl-wrap"><table><thead><tr><th>Servicio</th><th class="n">Cant.</th>${adm ? '<th class="n">Total</th><th></th>' : ''}</tr></thead><tbody>${c.servL.map(x => `<tr><td style="white-space:normal">${esc(x.descripcion)}<div class="tiny muted">${TIPOS_SERV[x.tipo]} · ${x.proveedor ? esc(x.proveedor) : 'propio'}</div></td><td class="n">${num(x.cantidad, 2)} ${esc(x.unidad || '')}</td>
        ${adm ? `<td class="n">${x.estado_costo === 'pendiente' ? '<span class="chip warn">sin costo</span>' : clp(x.total)}${x.estado_costo === 'estimado' ? ' <span class="chip est">est.</span>' : ''}</td><td><button class="btn ghost" data-act="costo-edit" data-t="servicios" data-id="${x.id}">${x.estado_costo === 'real' ? 'Editar' : 'Completar'}</button></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sin servicios.</div>'}
      <button class="btn ghost" data-act="serv-new" data-ot="${o.id}">+ Registrar servicio</button></div>
  </div>`;
}

    <div class="row"><button class="btn pri">Guardar</button>${o.id && isAdmin() ? `<button type="button" class="btn danger" data-act="ot-del" data-id="${o.id}">Eliminar</button>` : ''}</div></form>`);

/* ---------------- SERVICIOS */

      <div class="fgrid"><label class="f"><span>Cantidad</span><input type="number" name="cant" id="cs-c" min="0" step="any" required></label>
        <label class="f"><span>Guía / OC / factura</span><input type="text" name="doc" id="cs-doc"></label></div>
      <button class="btn pri xl">Registrar salida</button></form>
      <div class="card"><h2>Últimos movimientos</h2><div class="list">${rec.map(x => `<div class="item"><div class="t"><span class="ot">${esc(otOf(x.ot_id)?.numero)}</span> ${esc(x.descripcion)}<div class="small muted">${fechaTxt(x.fecha)} · ${x.origen === 'bodega' ? 'bodega' : 'compra directa'}${x.doc_ref ? ' · ' + esc(x.doc_ref) : ''}</div></div>
        <div style="text-align:right"><strong>${num(x.cantidad, 2)} ${esc(x.unidad || '')}</strong>${x.estado_costo === 'pendiente' ? '<div><span class="chip warn">sin costo</span></div>' : ''}</div></div>`).join('') || '<div class="empty">Sin movimientos.</div>'}</div></div></div>`;

/* ---------------- RESUMEN (admin) */
function vResumen() {
  const act = S.d.ots.filter(o => o.estado === 'en_proceso');
  const cs = act.map(o => ({o, c: costOT(o)}));
  const desde = addDays(hoy(), -6);
  const hh7 = S.d.hh.filter(r => r.fecha >= desde && closed(r));
  const tot7 = sum(hh7, r => r.horas) || 1;
  const porTipo = Object.keys(TIPOS_HH).map(k => [k, sum(hh7.filter(r => r.tipo === k), r => r.horas)]);
  const motivos = {}; hh7.filter(r => r.tipo === 'improductiva').forEach(r => motivos[r.motivo || 'Sin motivo'] = (motivos[r.motivo || 'Sin motivo'] || 0) + +r.horas);
  const extraP = {}; hh7.forEach(r => { if (+r.horas_extra) { const n = perfil(r.perfil_id)?.nombre || '—'; extraP[n] = (extraP[n] || 0) + +r.horas_extra; } });
  const costoExtra7 = sum(hh7, r => r.costo_extra);
  const bajo = S.d.materiales.filter(m => m.activo && +m.stock <= +m.stock_min);
  const sinCuadrar = []; for (let i = 1; i <= 6; i++) { const f = addDays(hoy(), -i); S.d.perfiles.forEach(p => { const q = cuadre(p.id, f); if (['bad', 'warn'].includes(q.st)) sinCuadrar.push({p, f, q}); }); }
  const pendAprob = S.d.hh.filter(r => r.estado === 'pendiente' && r.fecha < hoy() && closed(r)).length;
  const sinCosto = sum(cs, x => x.c.pendientes);
  const totReal = sum(cs, x => x.c.total), totPpto = sum(cs, x => x.c.pTotal), totVenta = sum(cs, x => +x.c.p?.precio_venta || 0);
  const trabajando = S.d.hh.filter(r => !closed(r) && r.fecha === hoy()).length;
  return `
  <div class="row between"><div><div class="label">${fechaTxt(hoy())}</div><h1>Resumen del taller</h1></div><span class="chip run"><span class="dot"></span> ${trabajando} personas trabajando ahora</span></div>
  <div class="grid2">
    <div class="card"><div class="label">OT en proceso · costo real a la fecha</div><div class="big">${clp(totReal)}</div>
      <div class="small muted">Cotizado ${clp(totPpto)} · venta ${clp(totVenta)} · ${act.length} OT</div>
      <div class="row">${sinCosto ? `<span class="chip warn">${sinCosto} costos sin dato</span>` : '<span class="chip ok">Todos los costos con dato</span>'}${pendAprob ? `<span class="chip warn">${pendAprob} registros de HH sin aprobar</span>` : ''}</div></div>
    <div class="card"><div class="label">Alertas</div><div class="list">
      ${sinCuadrar.length ? `<div class="item"><div class="t">${sinCuadrar.length} ${sinCuadrar.length === 1 ? 'día-persona' : 'días-persona'} sin cuadrar esta semana<div class="small muted">${[...new Set(sinCuadrar.map(x => x.p.nombre))].slice(0, 4).map(esc).join(', ')}</div></div><button class="btn ghost" data-act="go-validar" data-f="${sinCuadrar[0].f}">Revisar</button></div>` : ''}
      ${bajo.length ? `<div class="item"><div class="t">${bajo.length} materiales bajo mínimo<div class="small muted">${bajo.slice(0, 3).map(m => esc(m.nombre)).join(', ')}</div></div><button class="btn ghost" data-act="go-stock">Ver stock</button></div>` : ''}
      ${cs.filter(x => x.o.fecha_entrega && x.o.fecha_entrega < hoy()).map(x => `<div class="item"><div class="t"><span class="ot">${esc(x.o.numero)}</span> atrasada</div><span class="small muted">entrega ${fechaTxt(x.o.fecha_entrega)}</span></div>`).join('')}
      ${cs.filter(x => x.c.pTotal && x.c.total > x.c.pTotal * .9).map(x => `<div class="item"><div class="t"><span class="ot">${esc(x.o.numero)}</span> lleva ${pct(x.c.total / x.c.pTotal * 100)} del presupuesto</div><span class="small muted">${pct(x.c.avancePiezas * 100)} piezas</span></div>`).join('')}
      ${!sinCuadrar.length && !bajo.length ? '<div class="small muted">Sin alertas.</div>' : ''}</div></div>
  </div>
  <h2>OT en proceso</h2>
  <div class="grid3">${act.map(otCard).join('') || '<div class="empty">No hay OT en proceso.</div>'}</div>
  <h2>Últimos 7 días</h2>
  <div class="grid2">
    <div class="card"><div class="row between"><h3>Uso de las horas</h3><span class="muted small">${hrs(tot7)}</span></div>
      <div class="stack">${porTipo.map(([k, v]) => `<i style="width:${v / tot7 * 100}%;background:${COL[k]}" title="${TIPOS_HH[k]} ${hrs(v)}"></i>`).join('')}</div>
      <div class="legend">${porTipo.map(([k, v]) => `<span style="--c:${COL[k]}">${TIPOS_HH[k]} ${hrs(v)} (${pct(v / tot7 * 100)})</span>`).join('')}</div>
      ${Object.keys(motivos).length ? `<div class="label">Esperas y detenciones</div><div class="kv small">${Object.entries(motivos).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span>${esc(k)}</span><span class="v">${hrs(v)}</span>`).join('')}</div>` : ''}</div>
    <div class="card"><div class="row between"><h3>Horas extra</h3><span class="muted small">${hrs(sum(Object.values(extraP), x => x))} · ${clp(costoExtra7)}</span></div>
      <div class="kv small">${Object.entries(extraP).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span>${esc(k)}</span><span class="v">${hrs(v)}</span>`).join('') || '<span class="muted">Sin horas extra.</span>'}</div>
      <button class="btn ghost" data-act="tab" data-k="reportes">Reporte por trabajador</button></div>
  </div>`;
}

/* ---------------- REPORTES (admin) */
function repData() {
  const d = S.ui.repDesde || addDays(hoy(), -(+hoy().slice(8) - 1)), h = S.ui.repHasta || hoy();
  const rs = S.d.hh.filter(r => r.fecha >= d && r.fecha <= h && closed(r));
  const rows = S.d.perfiles.map(p => {
    const x = rs.filter(r => r.perfil_id === p.id);
    const by = k => sum(x.filter(r => r.tipo === k), r => r.horas);
    return {p, dias: new Set(x.map(r => r.fecha)).size, directa: by('directa'), retrabajo: by('retrabajo'), indirecta: by('indirecta'), improductiva: by('improductiva'),
      total: sum(x, r => r.horas), extra: sum(x, r => r.horas_extra), costo: sum(x, r => (+r.costo_hh || 0) + (+r.costo_extra || 0)), pend: x.filter(r => r.estado === 'pendiente').length};
  }).filter(r => r.total);
  return {d, h, rows};
}
function vReportes() {
  const {d, h, rows} = repData();
  const T = k => sum(rows, r => r[k]);
  return `<div class="row between"><h1>Reportes</h1></div>
  <div class="card"><div class="row" style="align-items:end">
    <label class="f"><span>Desde</span><input type="date" id="rep-d" data-change="rep-d" value="${d}"></label>
    <label class="f"><span>Hasta</span><input type="date" id="rep-h" data-change="rep-h" value="${h}"></label>
    <button class="btn" data-act="rep-mes" data-n="0">Este mes</button><button class="btn" data-act="rep-mes" data-n="-1">Mes anterior</button></div>
    ${d < addDays(hoy(), -62) && !DEMO ? '<p class="small muted">Para fechas de más de 2 meses atrás, la app trae los datos al aplicar el filtro.</p>' : ''}</div>
  <div class="card"><div class="row between"><h2>Horas por trabajador</h2><button class="btn" data-act="csv-rep">Exportar para remuneraciones</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Trabajador</th><th>Categoría</th><th class="n">Días</th><th class="n">Directas</th><th class="n">Retrabajo</th><th class="n">Indirectas</th><th class="n">Esperas</th><th class="n">Total</th><th class="n">Extra</th><th class="n">Costo</th><th class="n">Sin aprobar</th></tr></thead><tbody>
    ${rows.sort((a, b) => b.total - a.total).map(r => `<tr><td>${esc(r.p.nombre)}</td><td>${esc(byId(S.d.tarifas, r.p.tarifa_id)?.nombre || '—')}</td><td class="n">${r.dias}</td><td class="n">${num(r.directa)}</td><td class="n">${num(r.retrabajo)}</td><td class="n">${num(r.indirecta)}</td><td class="n">${num(r.improductiva)}</td><td class="n"><strong>${num(r.total)}</strong></td><td class="n">${num(r.extra)}</td><td class="n">${clp(r.costo)}</td><td class="n">${r.pend || ''}</td></tr>`).join('')}
    <tr><td><strong>Total</strong></td><td></td><td></td><td class="n">${num(T('directa'))}</td><td class="n">${num(T('retrabajo'))}</td><td class="n">${num(T('indirecta'))}</td><td class="n">${num(T('improductiva'))}</td><td class="n"><strong>${num(T('total'))}</strong></td><td class="n">${num(T('extra'))}</td><td class="n">${clp(T('costo'))}</td><td></td></tr>
    </tbody></table></div>
    <p class="small muted">Productividad: ${pct(T('directa') / (T('total') || 1) * 100)} de las horas fueron directas en OT. Retrabajo ${pct(T('retrabajo') / (T('total') || 1) * 100)}.</p></div>
  <div class="card"><div class="row between"><h2>Costo por OT</h2><button class="btn" data-act="csv-ots">Exportar para el ERP</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>OT</th><th>Cliente</th><th>Estado</th><th class="n">HH</th><th class="n">M. obra</th><th class="n">Máquinas</th><th class="n">Materiales</th><th class="n">Servicios</th><th class="n">GG</th><th class="n">Total</th><th class="n">Cotizado</th><th class="n">Venta</th><th class="n">Margen</th></tr></thead><tbody>
    ${S.d.ots.map(o => { const c = costOT(o); return `<tr class="click" data-act="ot-open" data-id="${o.id}"><td><span class="ot">${esc(o.numero)}</span></td><td>${esc(o.cliente)}</td><td>${ESTADOS_OT[o.estado]}</td><td class="n">${num(c.horas)}</td><td class="n">${clp(c.mo + c.extra)}</td><td class="n">${clp(c.maq)}</td><td class="n">${clp(c.mat)}</td><td class="n">${clp(c.serv)}</td><td class="n">${clp(c.gg)}</td><td class="n"><strong>${clp(c.total)}</strong></td><td class="n">${clp(c.pTotal)}</td><td class="n">${clp(c.p?.precio_venta)}</td><td class="n" style="color:${(c.margen || 0) < 0 ? 'var(--bad)' : 'inherit'}">${c.margen == null ? '—' : clp(c.margen)}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="small muted">Las OT entregadas hace más de 2 meses traen sus horas al abrirlas.</p></div>`;

/* ================================================================ CSV */
function csv(name, head, rows) {
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const n = v => typeof v === 'number' ? String(Math.round(v * 100) / 100).replace('.', ',') : v;
  const txt = '﻿' + [head, ...rows].map(r => r.map(v => q(n(v))).join(';')).join('\r\n');
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'text/csv;charset=utf-8'})); a.download = name; document.body.append(a); a.click(); a.remove();
    toast('Archivo descargado (se abre en Excel)');
  } catch (e) { toast('No se pudo descargar en esta vista'); }
}

async function aprobar(pids) {

    else { const {error} = await Cloud.sb.from('hh_registros').update({estado: 'aprobado', aprobado_por: S.me.id}).in('id', ids); if (error) throw error; }
  }, `${ids.length} registros aprobados`);

const FORMS = {
  async login(fd) {
    const u = fd.get('u').trim().toLowerCase(), email = u.includes('@') ? u : `${u}@${CONFIG.DOMINIO_USUARIOS}`;
    const {data, error} = await Cloud.sb.auth.signInWithPassword({email, password: fd.get('p')});
    if (error) return toast('Usuario o clave incorrectos');
    await afterLogin(data.user);
  },
  manual(fd) {
    const pid = fd.get('pid'), id = +fd.get('id') || null, tipo = fd.get('tipo'), sin = ['indirecta', 'improductiva'].includes(tipo);
    const row = {tipo, fecha: fd.get('fecha'), nota: fd.get('nota') || null, ot_id: sin ? null : +fd.get('ot') || null, operacion_id: sin ? null : +fd.get('op') || null, maquina_id: sin ? null : +fd.get('maq') || null, motivo: sin ? (fd.get('motivo') || TIPOS_HH[tipo]) : null};
    if (!sin && !row.ot_id) return toast('Elige la OT');
    const rec = id ? byId(S.d.hh, id) : null;
    if (rec?.inicio) {
      const ini = fd.get('ini'), fin = fd.get('fin');
      row.inicio = tsAt(row.fecha, ini); row.fin = fin ? tsAt(row.fecha, fin) : null;
      if (row.fin && new Date(row.fin) <= new Date(row.inicio)) return toast('El término debe ser posterior al inicio');
    } else { row.horas = +fd.get('horas'); row.manual = true; if (!(row.horas > 0)) return toast('Indica las horas'); }
    if (fd.has('extra')) { const ex = +fd.get('extra'); if (Math.abs(ex - +rec.horas_extra) > 0.001) { row.horas_extra = ex; row.extra_manual = true; } }
    if (id) return run(() => DB.upd('hh_registros', id, row), 'Registro corregido');
    return run(() => DB.ins('hh_registros', {...row, perfil_id: pid}), 'Horas agregadas');
  },
  asis(fd) {
    const pid = fd.get('pid') || fd.get('pid2'), f = fd.get('fecha'), id = +fd.get('id') || null;
    const row = {entrada: tsAt(f, fd.get('ent')), salida: fd.get('sal') ? tsAt(f, fd.get('sal')) : null};
    if (row.salida && row.salida <= row.entrada) return toast('La salida debe ser posterior a la entrada');
    const ex = asisDia(pid, f);
    return run(() => (id || ex) ? DB.upd('asistencia', id || ex.id, row) : DB.ins('asistencia', {...row, perfil_id: pid, fecha: f}), 'Asistencia guardada');
  },
  'asis-propia'(fd) { const a = byId(S.d.asistencia, +fd.get('id')), sal = tsAt(fd.get('fecha'), fd.get('sal'));
    if (sal <= a.entrada) return toast('La salida debe ser posterior a la entrada'); return run(() => DB.upd('asistencia', a.id, {salida: sal}), 'Salida guardada'); },
  ot(fd) {
    const id = +fd.get('id') || null, n = k => fd.get(k) === '' || fd.get(k) == null ? null : +fd.get(k);
    const row = {numero: fd.get('numero').trim(), estado: fd.get('estado'), cliente: fd.get('cliente').trim(), descripcion: fd.get('descripcion') || null, cantidad: n('cantidad') || 1, unidad: fd.get('unidad') || 'pza',
      terminadas: n('terminadas') || 0, fecha_entrega: fd.get('fecha_entrega') || null, ppto_horas: n('ppto_horas')};
    if (S.d.ots.some(o => o.numero.toLowerCase() === row.numero.toLowerCase() && o.id !== id)) return toast('Ya existe una OT con ese número');
    return run(async () => {
      const o = id ? await DB.upd('ots', id, row) : await DB.ins('ots', row);
      if (isAdmin() && ['ppto_hh', 'ppto_material', 'ppto_servicios', 'ppto_maquina', 'precio_venta'].some(k => fd.get(k) !== '')) {
        await DB.upsert('ot_ppto', {ot_id: o.id, ppto_hh: n('ppto_hh') || 0, ppto_material: n('ppto_material') || 0, ppto_servicios: n('ppto_servicios') || 0, ppto_maquina: n('ppto_maquina') || 0, precio_venta: n('precio_venta') || 0});
      }
    }, id ? 'OT guardada' : 'OT creada');
  },
  serv(fd) {
    const ext = fd.get('modo') === 'externo', cu = fd.get('cu');
    const row = {ot_id: +fd.get('ot'), cantidad: +fd.get('cant'), doc_ref: fd.get('doc') || null, costo_unit: cu === '' || cu == null ? null : +cu};
    if (!(row.cantidad > 0)) return toast('Indica la cantidad');
    if (ext) Object.assign(row, {tipo: fd.get('tipo'), proveedor: fd.get('prov') || null, descripcion: fd.get('desc') || TIPOS_SERV[fd.get('tipo')], unidad: fd.get('unidad') || 'un'});
    else row.proceso_id = +fd.get('proc');
    return run(() => DB.ins('servicios', row), row.costo_unit == null && ext ? 'Registrado. Costo pendiente para administración' : 'Registrado');
  },
  consumo(fd) {
    const dir = fd.get('origen') === 'compra_directa', cu = fd.get('cu');
    const row = {ot_id: +fd.get('ot'), cantidad: +fd.get('cant'), origen: fd.get('origen'), doc_ref: fd.get('doc') || null};
    if (!(row.cantidad > 0)) return toast('Indica la cantidad');
    if (dir) { Object.assign(row, {descripcion: fd.get('desc'), unidad: fd.get('unidad') || 'un', costo_unit: cu === '' ? null : +cu}); if (!row.descripcion) return toast('Describe el material'); }
    else { row.material_id = +fd.get('mat'); if (!row.material_id) return toast('Elige el material'); const m = byId(S.d.materiales, row.material_id); if (+m.stock < row.cantidad) toast(`Ojo: el stock queda negativo (${num(m.stock - row.cantidad, 2)} ${m.unidad})`); }
    return run(() => DB.ins('consumos', row), 'Salida de material registrada');
  },
  ingreso(fd) {
    const cu = fd.get('cu'); const row = {material_id: +fd.get('mat'), cantidad: +fd.get('cant'), costo_unit: cu === '' ? null : +cu, doc_ref: fd.get('doc') || null};
    if (!row.material_id || !(row.cantidad > 0)) return toast('Elige material y cantidad');
    return run(() => DB.ins('stock_ingresos', row), 'Ingreso registrado');
  },
  costo(fd) { const t = fd.get('t'), id = +fd.get('id'); return run(() => DB.upd(t, id, {costo_unit: +fd.get('cu'), estado_costo: fd.get('est') ? 'estimado' : 'real', doc_ref: fd.get('doc') || null}), 'Costo actualizado'); },
  param(fd) { return run(async () => { for (const k of ['gg_pct', 'jornada_horas', 'colacion_min']) await DB.upsert('config', {clave: k, valor: +fd.get(k)}); }, 'Parámetros guardados'); },
  async cat(fd) {
    const k = fd.get('_k'), c = CAT[k], id = fd.get('_id');
    const row = {};
    c.fields.forEach(([f, , ty]) => { const v = fd.get(f); row[f] = ty === 'bool' ? !!v : ty === 'num' ? (v === '' ? null : +v) : ty === 'sel' ? (v === '' ? null : (/_id$/.test(f) ? +v : v)) : (v || null); });
    if (k === 'tarifas' && row.costo_hh_extra == null && row.costo_hh != null) row.costo_hh_extra = Math.round(row.costo_hh * 1.5);
    if (k === 'maquinas' && row.costo_hh == null) row.costo_hh = 0;
    if (k === 'procesos' && row.costo_unit == null) row.costo_unit = 0;
    if (k === 'materiales') { row.stock = row.stock ?? 0; row.stock_min = row.stock_min ?? 0; }
    if (k === 'trabajadores' && id === '') {
      const usuario = fd.get('usuario').trim().toLowerCase().replace(/\s+/g, '');
      if (S.d.perfiles.some(p => p.usuario === usuario)) return toast('Ese usuario ya existe');
      return run(async () => {
        if (DEMO) { await DB.ins('perfiles', {...row, usuario}); return; }
        const tmp = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {auth: {persistSession: false, autoRefreshToken: false, storageKey: 'tmp-signup'}});
        const {data, error} = await tmp.auth.signUp({email: `${usuario}@${CONFIG.DOMINIO_USUARIOS}`, password: fd.get('clave'), options: {data: {nombre: row.nombre}}});
        if (error) throw error;
        await DB.upd('perfiles', data.user.id, {...row, activo: row.activo});
      }, `Trabajador creado. Usuario: ${usuario}`);
    }
    const pkv = c.key ? id : (k === 'trabajadores' ? id : +id);
    return run(() => id !== '' ? DB.upd(c.t, pkv, row) : DB.ins(c.t, row), 'Guardado');
  }
};

  const sel = document.getElementById(k === 'cs-buscar' ? 'cs-mat' : 'in-mat'), q = e.target.value.toLowerCase();
  [...sel.options].forEach(o => o.hidden = q && !o.textContent.toLowerCase().includes(q));
  const first = [...sel.options].find(o => !o.hidden); if (first && sel.selectedOptions[0]?.hidden !== false) sel.value = first.value;
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.me && !document.querySelector('.sheet')) reload(); });

/* ================================================================ ARRANQUE */
async function afterLogin(user) {
  const {data} = await Cloud.sb.from('perfiles').select('*').eq('id', user.id).maybeSingle();
  S.me = data || {id: user.id, nombre: user.email.split('@')[0], usuario: user.email.split('@')[0], rol: 'operario', activo: false};
  await reload();
}
(async function start() {
  if (DEMO) {
    try { S.demoAs = localStorage.getItem('taller-demo-as'); } catch (e) {}
    S.me = {id: 'p-admin'}; Demo.init();
    if (!Demo.ready) return;
    await reload();
    return;
  }
  if (!window.supabase) { document.getElementById('app').innerHTML = '<div class="wrap"><div class="card login"><h2>Sin conexión</h2><p>No se pudo cargar la app. Revisa la conexión e inténtalo de nuevo.</p></div></div>'; return; }
  Cloud.init();
  const {data} = await Cloud.sb.auth.getSession();
  if (data.session) await afterLogin(data.session.user); else render();
})();
</script>
